services:
  traefik:
    image: traefik:v2.4
    network_mode: bridge
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./data/traefik/acme:/acme"
      - "./data/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./data/traefik/dynamic:/opt/traefik/dynamic"
    restart: unless-stopped
  nginx-relay:
    image: nginx:stable-alpine
    restart: unless-stopped
    volumes:
      - ./data/nginx-relay:/usr/conf.d
    # This config assumes that the traefik container has access to the bridge network
    network_mode: bridge
    ports: 
      - 4433
    labels:
      - traefik.enable=true
      - traefik.tcp.routers.signal-proxy.rule=HostSNI("signal.mydomain.com") 
      - traefik.tcp.routers.signal-proxy.tls=true
      - traefik.tcp.routers.signal-proxy.tls.certresolver=leresolver
      # The nginx image only exposes port 80, so Traefik can't detect the relay port on its own
      - traefik.tcp.services.signal-proxy.loadbalancer.server.port=4433
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; /usr/sbin/nginx -s reload; done & /usr/sbin/nginx -c /usr/conf.d/nginx.conf -g \"daemon off;\"'"

